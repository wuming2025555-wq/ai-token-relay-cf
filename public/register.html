<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 — AI Token 中转站</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <svg class="logo-hex" viewBox="0 0 34 34" fill="none">
          <path d="M17 2L30 9.5V24.5L17 32L4 24.5V9.5L17 2Z" fill="#6c63ff" fill-opacity="0.12" stroke="#6c63ff" stroke-width="1.5"/>
          <path d="M17 7L25.5 11.75V21.25L17 26L8.5 21.25V11.75L17 7Z" fill="#6c63ff" fill-opacity="0.25" stroke="#6c63ff" stroke-width="1.2"/>
          <text x="17" y="19" text-anchor="middle" fill="#6c63ff" font-size="9" font-weight="700" font-family="Space Grotesk, sans-serif">AI</text>
        </svg>
      </div>
      <h1>创建账号</h1>
      <p>注册即获 100 万免费 tokens</p>
    </div>
    <form id="registerForm">
      <div class="form-group">
        <label class="form-label" for="username">用户名</label>
        <input class="form-input" id="username" name="username" type="text" placeholder="3-32 个字符" required minlength="3" maxlength="32" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input class="form-input" id="password" name="password" type="password" placeholder="至少 6 个字符" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label" for="password2">确认密码</label>
        <input class="form-input" id="password2" type="password" placeholder="再次输入密码" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary w-full" style="padding:12px;font-size:1rem;margin-top:8px;" id="registerBtn">注 册</button>
    </form>
    <div class="login-footer">已有账号？<a href="/login">立即登录</a></div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="/js/app.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('registerBtn');
  btn.disabled = true; btn.textContent = '注册中...';
  const pwd = document.getElementById('password').value;
  const pwd2 = document.getElementById('password2').value;
  if (pwd !== pwd2) { showToast('两次密码输入不一致', 'error'); btn.disabled = false; btn.textContent = '注 册'; return; }
  try {
    const resp = await fetch('/api/auth/register', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username: document.getElementById('username').value, password: pwd }),
    });
    const data = await resp.json();
    if (!resp.ok) { showToast(data.error || '注册失败', 'error'); btn.disabled = false; btn.textContent = '注 册'; return; }
    document.cookie = `token=${data.token};path=/;max-age=86400;SameSite=Lax`;
    showToast('注册成功，已自动登录', 'success');
    setTimeout(() => { window.location.href = '/dashboard'; }, 400);
  } catch (err) {
    showToast('网络错误，请稍后重试', 'error');
    btn.disabled = false; btn.textContent = '注 册';
  }
});
</script>
</body>
</html>
